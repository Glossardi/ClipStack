<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <!-- Background: rounded black square (macOS app icon style) -->
  <rect width="600" height="600" rx="130" ry="130" fill="#0a0a0a"/>

  <!-- Layers icon, centered at 300,300, scaled to ~260px -->
  <g transform="translate(300,300)" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top layer diamond -->
    <polygon points="0,-120 110,-60 0,0 -110,-60"/>
    <!-- Middle layer line -->
    <polyline points="-110,10 0,70 110,10"/>
    <!-- Bottom layer line -->
    <polyline points="-110,70 0,130 110,70"/>
  </g>
</svg>
