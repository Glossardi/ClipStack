services:
  clipstack-web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      CLIPSTACK_SITE_URL: "https://clipstack.click"
      CLIPSTACK_GITHUB_REPO: "Glossardi/ClipStack"
      CLIPSTACK_GITHUB_PROJECT_URL: "https://github.com/Glossardi/ClipStack"
      CLIPSTACK_UMAMI_SCRIPT_URL: "https://analytics.glossardi.de/script.js"
      CLIPSTACK_UMAMI_WEBSITE_ID: "c230ce3d-9704-46bc-9e3d-ae3bb1f35633"
    restart: unless-stopped
