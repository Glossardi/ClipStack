name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version_check:
    runs-on: ubuntu-latest
    outputs:
      release_needed: ${{ steps.version.outputs.release_needed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect version bump
        id: version
        shell: bash
        run: |
          set -euo pipefail

          current_version="$(sed -nE 's/^version = "([^"]+)"/\1/p' src-tauri/Cargo.toml | head -n1)"
          if [[ -z "${current_version}" ]]; then
            echo "Could not parse version from src-tauri/Cargo.toml" >&2
            exit 1
          fi

          previous_version=""
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            previous_version="$(git show HEAD~1:src-tauri/Cargo.toml 2>/dev/null | sed -nE 's/^version = "([^"]+)"/\1/p' | head -n1 || true)"
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "release_needed=true" >> "${GITHUB_OUTPUT}"
          elif [[ -n "${previous_version}" && "${previous_version}" == "${current_version}" ]]; then
            echo "release_needed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "release_needed=true" >> "${GITHUB_OUTPUT}"
          fi

          echo "version=${current_version}" >> "${GITHUB_OUTPUT}"
          echo "Current version: ${current_version}"
          echo "Previous version: ${previous_version:-<none>}"

  test:
    needs: version_check
    if: needs.version_check.outputs.release_needed == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Verify version sync
        run: ./scripts/check-version-sync.sh

      - name: Install dependencies
        run: npm ci

      - name: Ensure frontend dist path exists for Rust compile checks
        run: mkdir -p build

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Run Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Run frontend tests when available
        shell: bash
        run: |
          set -euo pipefail
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.test ? 0 : 1)"; then
            npm run test
          else
            echo "No npm test script found, skipping."
          fi

  release:
    needs:
      - version_check
      - test
    if: needs.version_check.outputs.release_needed == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Add cross-compilation targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Import Apple signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -n "$APPLE_CERTIFICATE" ]]; then
            echo "Importing Developer ID certificate..."
            echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
            security create-keychain -p "" build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p "" build.keychain
            security import /tmp/certificate.p12 -k build.keychain \
              -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
            rm /tmp/certificate.p12
            echo "Certificate imported."
          else
            echo "No APPLE_CERTIFICATE — using ad-hoc signing."
          fi

      # Notarization env vars (APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID) are intentionally
      # omitted here. Passing them even as empty strings causes Tauri to attempt notarization
      # and fail. Add them back once a Developer ID Application certificate is fully set up.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
        with:
          tagName: v__VERSION__
          releaseName: v__VERSION__
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  publish_latest:
    needs:
      - version_check
      - release
    if: needs.version_check.outputs.release_needed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Sync latest DMGs for website downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version_check.outputs.version }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          source_tag="v${VERSION}"

          if gh release view latest >/dev/null 2>&1; then
            echo "Using existing latest release."
          else
            gh release create latest --title "Latest" --notes "Auto-updated latest ClipStack DMGs."
          fi

          rm -rf dist
          mkdir -p dist
          gh release download "${source_tag}" --pattern "*.dmg" --pattern "latest.json" --dir dist

          mapped=0
          for dmg in dist/*.dmg; do
            name="$(basename "${dmg}")"
            if [[ "${name}" == *aarch64* ]]; then
              cp "${dmg}" dist/ClipStack_latest_aarch64.dmg
              mapped=1
            elif [[ "${name}" == *x64* ]]; then
              cp "${dmg}" dist/ClipStack_latest_x64.dmg
              mapped=1
            fi
          done

          if [[ "${mapped}" -ne 1 ]]; then
            echo "No architecture-specific DMGs found on release ${source_tag}."
            exit 1
          fi

          # Upload DMGs + latest.json (updater endpoint) to the stable "latest" tag
          gh release upload latest dist/ClipStack_latest_*.dmg dist/latest.json --clobber
